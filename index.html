<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BridgeSpeak</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
}

header {
    background: #111827;
    color: white;
    padding: 18px 24px;
    font-size: 22px;
    font-weight: bold;
}

main {
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    margin-bottom: 8px;
}

.subtitle {
    color: #667085;
    margin-bottom: 25px;
}

select {
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}

.mic {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    border: none;
    background: #111827;
    color: white;
    font-size: 52px;
    cursor: pointer;
    margin: 30px;
}

.mic.listening {
    background: #b42318;
}

.status {
    font-size: 18px;
    font-weight: bold;
}

.box {
    text-align: left;
    margin-top: 25px;
    padding: 18px;
    background: #f8fafc;
    border: 1px solid #e4e7ec;
    border-radius: 14px;
}

.label {
    font-size: 11px;
    font-weight: bold;
    color: #667085;
    text-transform: uppercase;
}

.text {
    font-size: 20px;
    font-weight: bold;
    margin-top: 8px;
    min-height: 28px;
}

button.secondary {
    margin-top: 12px;
    padding: 11px 15px;
    border: none;
    border-radius: 9px;
    background: #e9eefc;
    color: #29358f;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    BridgeSpeak
</header>

<main>

<div class="card">

<h1>How can we help?</h1>

<p class="subtitle">
Choose your language, then tap the microphone and speak.
</p>

<select id="language">

<option value="es-US">
🇪🇸 Español — Spanish
</option>

<option value="en-US">
🇺🇸 English
</option>

<option value="zh-CN">
🇨🇳 Chinese
</option>

<option value="vi-VN">
🇻🇳 Vietnamese
</option>

<option value="fr-FR">
🇫🇷 French
</option>

<option value="de-DE">
🇩🇪 German
</option>

<option value="hi-IN">
🇮🇳 Hindi
</option>

<option value="ar-SA">
🇸🇦 Arabic
</option>

<option value="ko-KR">
🇰🇷 Korean
</option>

<option value="pt-BR">
🇧🇷 Portuguese
</option>

<option value="ja-JP">
🇯🇵 Japanese
</option>

<option value="tl-PH">
🇵🇭 Filipino
</option>

<option value="ru-RU">
🇷🇺 Russian
</option>

<option value="it-IT">
🇮🇹 Italian
</option>

<option value="pl-PL">
🇵🇱 Polish
</option>

<option value="uk-UA">
🇺🇦 Ukrainian
</option>

<option value="th-TH">
🇹🇭 Thai
</option>

<option value="fa-IR">
🇮🇷 Persian
</option>

<option value="pa-IN">
🇮🇳 Punjabi
</option>

<option value="lo-LA">
🇱🇦 Lao
</option>

</select>

<br>

<button id="mic" class="mic">
🎤
</button>

<div id="status" class="status">
Tap the microphone to speak
</div>

<div class="box">

<div class="label">
What we heard
</div>

<div id="heard" class="text">
Nothing yet.
</div>

</div>

<div class="box">

<div class="label">
English translation
</div>

<div id="translation" class="text">
Translation will appear here.
</div>

<button id="speak" class="secondary">
🔊 Hear English
</button>

</div>

</div>

</main>

<script>

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

const mic =
document.getElementById("mic");

const status =
document.getElementById("status");

const heard =
document.getElementById("heard");

const translation =
document.getElementById("translation");

const language =
document.getElementById("language");

let recognition;
let listening = false;


function startListening() {

if (!SpeechRecognition) {

alert(
"Speech recognition is not supported by this browser. Please use Google Chrome."
);

return;

}

recognition =
new SpeechRecognition();

recognition.lang =
language.value;

recognition.continuous = false;

recognition.interimResults = true;


recognition.onstart = function() {

listening = true;

mic.classList.add("listening");

mic.textContent = "⏹️";

status.textContent =
"Listening… speak now";

};


recognition.onresult =
function(event) {

let text = "";

for (
let i = event.resultIndex;
i < event.results.length;
i++
) {

text +=
event.results[i][0].transcript;

}

heard.textContent = text;

translateDemo(text);

};


recognition.onerror =
function(event) {

listening = false;

mic.classList.remove("listening");

mic.textContent = "🎤";

status.textContent =
"Microphone error: " + event.error;

if (
event.error === "not-allowed"
) {

alert(
"BridgeSpeak needs microphone permission. Please allow microphone access in Chrome."
);

}

};


recognition.onend =
function() {

listening = false;

mic.classList.remove("listening");

mic.textContent = "🎤";

status.textContent =
"Tap the microphone to speak again";

};

recognition.start();

}


function translateDemo(text) {

const lang =
language.value;

let result =
"Test translation: " + text;

const lower =
text.toLowerCase();


if (lang.startsWith("es")) {

if (
lower.includes("devolver")
) {

result =
"Can I return this?";

}

else if (
lower.includes("cuánto") ||
lower.includes("cuanto")
) {

result =
"How much does this cost?";

}

else if (
lower.includes("tarjeta")
) {

result =
"Do you accept cards?";

}

else if (
lower.includes("ayuda")
) {

result =
"Can you help me?";

}

}


if (lang.startsWith("en")) {

result = text;

}

translation.textContent =
result;

}


mic.onclick = function() {

if (listening) {

recognition.stop();

} else {

startListening();

}

};


document.getElementById("speak").onclick =
function() {

const text =
translation.textContent;

if (
"speechSynthesis" in window
) {

const speech =
new SpeechSynthesisUtterance(text);

speech.lang = "en-US";

speechSynthesis.cancel();

speechSynthesis.speak(speech);

}

};

</script>

</body>
</html>
